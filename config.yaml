name: "Page Bank"
app_id: "app-pagebank"
customer_id: "yeti"
version: "1.0"
schemas:
  path: schemas/schema.graphql

resources:
  path: resources/*.rs
  root: /api

static:
  path: web
  root: /
  spa: true
  build:
    source: source
    command: npm install && npm run build

env:
  PAGEBANK_ORIGIN_URL: "https://www.example.com"
